# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  push:
    branches: 
      - main
      - Part2-SendMessages
  pull_request:
    branches: 
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Pinning exact SHA for actions/checkout that natively targets Node 24+
      - name: Check out the code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        
      # Pinning exact SHA for actions/setup-java with Node 24 support
      - name: Set up JDK 25
        uses: actions/setup-java@3a47a56d2631a731b54a0e0a46ee31c79959774b # v4.7.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build project and run all tests
        run: mvn test

      # Optional: Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts
      - name: Update dependency graph
        uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6
